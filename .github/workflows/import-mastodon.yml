# Pull new Mastodon posts into the microblog and push them to master, which
# triggers the "github pages" workflow to rebuild and deploy the site.
name: import mastodon posts

on:
  schedule:
    - cron: '17 * * * *'  # hourly
  workflow_dispatch:
    inputs:
      since:
        description: 'Import posts on or after this date (YYYY-MM-DD), e.g. to backfill'
        required: false
      dry_run:
        description: 'Only show what would be imported'
        type: boolean
        default: false
  pull_request:
    paths:
      - scripts/import_mastodon.py
      - .github/workflows/import-mastodon.yml

# Posts before this date are never imported automatically. Older posts can be
# backfilled by running the workflow by hand with an earlier "since" date.
env:
  IMPORT_SINCE: '2026-10-21'

concurrency:
  group: import-mastodon

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pushing with the personal token (not GITHUB_TOKEN) is what lets the
          # push trigger the deploy workflow.
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.TOKEN }}

      - name: Check the importer against the live API
        if: github.event_name == 'pull_request'
        run: python3 scripts/import_mastodon.py --since "$(date -u -d '14 days ago' +%F)" --dry-run

      - name: Import
        if: github.event_name != 'pull_request'
        id: import
        env:
          SINCE: ${{ inputs.since || env.IMPORT_SINCE }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python3 scripts/import_mastodon.py --since "$SINCE" $DRY_RUN

      - name: Commit and push
        if: github.event_name != 'pull_request' && steps.import.outputs.count != '0' && !inputs.dry_run
        run: |
          git config user.name "Lee Turner"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add content/microblog static/img/mastodon
          git commit -m "Import ${{ steps.import.outputs.count }} microblog post(s) from Mastodon"
          git push origin HEAD:master
