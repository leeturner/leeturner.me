{{- $p := .page }}
<article class="mb-post">
  <header class="mb-post-head">
    <img src="{{ site.Params.avatar | relURL }}" alt="" width="42" height="42">
    <div>
      <strong>{{ $p.Params.author | default site.Params.author.name }}</strong>
      <a href="{{ $p.RelPermalink }}"><time datetime="{{ $p.Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ $p.Date | time.Format "2 January 2006" }}{{ if not .link }} · {{ $p.Date.Format "15:04" }}{{ end }}</time></a>
    </div>
  </header>
  <div class="mb-content">{{ $p.Content }}</div>
  {{- if .link }}
  <div class="mb-actions">
    {{- if ne $p.Params.comments false }}
    <a href="{{ $p.RelPermalink }}#comments"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/></svg>Reply</a>
    {{- end }}
    <a href="{{ $p.RelPermalink }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>Link</a>
  </div>
  {{- end }}
</article>
